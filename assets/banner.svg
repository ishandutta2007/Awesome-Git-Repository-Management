<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090D16"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E1B4B"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#FFF"/><stop offset="60%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient><linearGradient id="line-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".2"/><stop offset="50%" stop-color="#3B82F6" stop-opacity=".8"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity=".2"/></linearGradient><linearGradient id="line-orange" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#F97316" stop-opacity=".2"/><stop offset="50%" stop-color="#F43F5E" stop-opacity=".7"/><stop offset="100%" stop-color="#A855F7" stop-opacity=".2"/></linearGradient><radialGradient id="glow-1" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#3B82F6" stop-opacity=".35"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></radialGradient><radialGradient id="glow-2" cx="80%" cy="70%" r="50%"><stop offset="0%" stop-color="#A855F7" stop-opacity=".3"/><stop offset="100%" stop-color="#A855F7" stop-opacity="0"/></radialGradient><filter id="blur-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="pill-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.75;transform:scale(1.08)}}@keyframes dashFlow{0%{stroke-dashoffset:200}}@keyframes dashReverse{0%{stroke-dashoffset:0}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatFast{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes beacon{0%{r:5px;opacity:.9}50%{r:8px;opacity:.4}}@keyframes ringPulse{0%{r:6px;opacity:.8;stroke-width:1.5}}.ambient-glow-1{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:20% 30%}.ambient-glow-2{animation:pulseGlow 10s ease-in-out infinite alternate;transform-origin:80% 70%}.flow-line-1{stroke-dasharray:8 6;animation:dashFlow 12s linear infinite}.flow-line-2{stroke-dasharray:6 5;animation:dashReverse 15s linear infinite}.pulse-node{animation:beacon 3s ease-in-out infinite}.pulse-ring,.pulse-ring-delayed{animation:ringPulse 2.5s cubic-bezier(.2,.8,.2,1) infinite}.pulse-ring-delayed{animation-delay:1.25s}.pill-float-1{animation:floatSlow 6s ease-in-out infinite}.pill-float-2{animation:floatFast 7s ease-in-out infinite;animation-delay:1s}.pill-float-3{animation:floatSlow 8s ease-in-out infinite;animation-delay:2s}.pill-float-4{animation:floatFast 6.5s ease-in-out infinite;animation-delay:1.5s}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g opacity=".12"><path stroke="#94A3B8" stroke-width=".8" d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300"/><path stroke="#94A3B8" stroke-width=".8" d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360"/></g><circle cx="240" cy="110" r="260" fill="url(#glow-1)" class="ambient-glow-1"/><circle cx="960" cy="250" r="280" fill="url(#glow-2)" class="ambient-glow-2"/><g opacity=".65"><path fill="none" stroke="url(#line-cyan)" stroke-width="2.5" d="M 60,70 L 380,70 Q 420,70 440,110 L 480,180 Q 500,210 540,210 L 1140,210" class="flow-line-1"/><path fill="none" stroke="url(#line-orange)" stroke-width="2.2" d="M 160,280 L 340,280 Q 380,280 400,240 L 440,170 Q 460,140 500,140 L 1140,140" class="flow-line-2"/><path fill="none" stroke="#6366F1" stroke-dasharray="5 5" stroke-opacity=".4" stroke-width="1.8" d="M 620,210 Q 660,210 680,260 L 720,310 Q 740,330 780,330 L 1100,330"/><path fill="none" stroke="#38BDF8" stroke-opacity=".3" stroke-width="1.5" d="M 220,70 Q 250,70 270,120 L 290,170 Q 310,210 350,210 L 420,210"/></g><g><circle cx="160" cy="70" r="6" fill="#38BDF8" class="pulse-node" filter="url(#blur-glow)"/><circle cx="160" cy="70" r="6" fill="none" stroke="#38BDF8" class="pulse-ring"/><circle cx="340" cy="280" r="5" fill="#F43F5E" class="pulse-node"/><circle cx="340" cy="280" r="5" fill="none" stroke="#F43F5E" class="pulse-ring-delayed"/><circle cx="540" cy="210" r="6" fill="#818CF8" class="pulse-node" filter="url(#blur-glow)"/><circle cx="540" cy="210" r="6" fill="none" stroke="#818CF8" class="pulse-ring"/><circle cx="820" cy="140" r="5" fill="#34D399" class="pulse-node"/><circle cx="1020" cy="210" r="5" fill="#F59E0B" class="pulse-node"/></g><g opacity=".85"><g class="pill-float-1" transform="translate(940, 48)"><rect width="135" height="30" fill="#1E293B" fill-opacity=".85" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1" filter="url(#pill-glow)" rx="15"/><circle cx="16" cy="15" r="4" fill="#38BDF8"/><text x="28" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing=".5">SELF-HOSTED</text></g><g class="pill-float-2" transform="translate(1010, 95)"><rect width="125" height="30" fill="#1E293B" fill-opacity=".85" stroke="#8B5CF6" stroke-opacity=".5" stroke-width="1" filter="url(#pill-glow)" rx="15"/><circle cx="16" cy="15" r="4" fill="#A855F7"/><text x="28" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing=".5">DEVSECOPS</text></g><g class="pill-float-3" transform="translate(850, 290)"><rect width="120" height="28" fill="#1E293B" fill-opacity=".85" stroke="#EC4899" stroke-opacity=".4" stroke-width="1" rx="14"/><circle cx="14" cy="14" r="4" fill="#F43F5E"/><text x="26" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing=".5">GIT FORGES</text></g><g class="pill-float-4" transform="translate(990, 280)"><rect width="130" height="28" fill="#1E293B" fill-opacity=".85" stroke="#10B981" stroke-opacity=".4" stroke-width="1" rx="14"/><circle cx="14" cy="14" r="4" fill="#34D399"/><text x="26" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing=".5">FOSS &amp; SAAS</text></g></g><g><g transform="translate(90, 110) translate(0, 15)"><rect width="84" height="84" x="0" y="0" fill="url(#accent-grad)" rx="20"/><circle cx="28" cy="60" r="6" fill="#FFF"/><circle cx="28" cy="24" r="6" fill="#FFF"/><circle cx="58" cy="38" r="6" fill="#FFF"/><path stroke="#FFF" stroke-linecap="round" stroke-width="4" d="M 28,60 L 28,24"/><path fill="none" stroke="#FFF" stroke-linecap="round" stroke-width="4" d="M 28,48 Q 28,38 42,38 L 58,38"/></g><g><g transform="translate(90, 110) translate(112, 0) translate(0, 10)"><rect width="190" height="22" fill="#3B82F6" fill-opacity=".2" stroke="#60A5FA" stroke-opacity=".4" stroke-width="1" rx="6"/><text x="10" y="15" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM</text></g><text x="0" y="66" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-.5" transform="translate(90, 110) translate(112, 0)">Awesome Git Repository Management</text><text x="0" y="98" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing=".2" transform="translate(90, 110) translate(112, 0)">Self-Hosted Git Servers • Lightweight Forges • Enterprise DevOps Platforms</text><g><text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" transform="translate(90, 110) translate(112, 0) translate(0, 126)"><tspan fill="#38BDF8" font-weight="700">14+</tspan> Open-Source Forges • <tspan fill="#34D399" font-weight="700">7</tspan> Enterprise SaaS Solutions • <tspan fill="#F43F5E" font-weight="700">100%</tspan> Verified Benchmarks</text></g></g></g><rect width="1200" height="360" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.5" rx="16"/></svg>