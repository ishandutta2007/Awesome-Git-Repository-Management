<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="line-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="line-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Ambient Glow Filters -->
    <radialGradient id="glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dashReverse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes beacon {
        0%, 100% { r: 5px; opacity: 0.9; }
        50% { r: 8px; opacity: 0.4; }
      }
      @keyframes ringPulse {
        0% { r: 6px; opacity: 0.8; stroke-width: 1.5; }
        100% { r: 18px; opacity: 0; stroke-width: 0.2; }
      }

      .ambient-glow-1 { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: 20% 30%; }
      .ambient-glow-2 { animation: pulseGlow 10s ease-in-out infinite alternate; transform-origin: 80% 70%; }
      .flow-line-1 { stroke-dasharray: 8 6; animation: dashFlow 12s linear infinite; }
      .flow-line-2 { stroke-dasharray: 6 5; animation: dashReverse 15s linear infinite; }
      .pulse-node { animation: beacon 3s ease-in-out infinite; }
      .pulse-ring { animation: ringPulse 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .pulse-ring-delayed { animation: ringPulse 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; animation-delay: 1.25s; }
      .pill-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .pill-float-2 { animation: floatFast 7s ease-in-out infinite; animation-delay: 1s; }
      .pill-float-3 { animation: floatSlow 8s ease-in-out infinite; animation-delay: 2s; }
      .pill-float-4 { animation: floatFast 6.5s ease-in-out infinite; animation-delay: 1.5s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#94A3B8" stroke-width="0.8" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" stroke="#94A3B8" stroke-width="0.8" />
  </g>

  <!-- Ambient Dynamic Glows (Background Layer) -->
  <circle cx="240" cy="110" r="260" fill="url(#glow-1)" class="ambient-glow-1" />
  <circle cx="960" cy="250" r="280" fill="url(#glow-2)" class="ambient-glow-2" />

  <!-- DYNAMIC GIT GRAPH BRANCHES (Layer behind text) -->
  <g opacity="0.65">
    <!-- Main Commit Trunk -->
    <path d="M 60,70 L 380,70 Q 420,70 440,110 L 480,180 Q 500,210 540,210 L 1140,210" fill="none" stroke="url(#line-cyan)" stroke-width="2.5" class="flow-line-1" />
    
    <!-- Feature Branch 1 -->
    <path d="M 160,280 L 340,280 Q 380,280 400,240 L 440,170 Q 460,140 500,140 L 1140,140" fill="none" stroke="url(#line-orange)" stroke-width="2.2" class="flow-line-2" />

    <!-- Feature Branch 2 (Lower loop) -->
    <path d="M 620,210 Q 660,210 680,260 L 720,310 Q 740,330 780,330 L 1100,330" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="5 5" />
    
    <!-- Branch Connector Curves -->
    <path d="M 220,70 Q 250,70 270,120 L 290,170 Q 310,210 350,210 L 420,210" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" />
  </g>

  <!-- Animated Commit Nodes & Rings (Background Depth) -->
  <g>
    <!-- Node A -->
    <circle cx="160" cy="70" r="6" fill="#38BDF8" class="pulse-node" filter="url(#blur-glow)" />
    <circle cx="160" cy="70" r="6" fill="none" stroke="#38BDF8" class="pulse-ring" />

    <!-- Node B -->
    <circle cx="340" cy="280" r="5" fill="#F43F5E" class="pulse-node" />
    <circle cx="340" cy="280" r="5" fill="none" stroke="#F43F5E" class="pulse-ring-delayed" />

    <!-- Node C -->
    <circle cx="540" cy="210" r="6" fill="#818CF8" class="pulse-node" filter="url(#blur-glow)" />
    <circle cx="540" cy="210" r="6" fill="none" stroke="#818CF8" class="pulse-ring" />

    <!-- Node D -->
    <circle cx="820" cy="140" r="5" fill="#34D399" class="pulse-node" />
    <circle cx="1020" cy="210" r="5" fill="#F59E0B" class="pulse-node" />
  </g>

  <!-- FLOATING BADGE PILLS (Subtle dynamic elements in background corners) -->
  <g opacity="0.85">
    <!-- Pill 1: Self-Hosted -->
    <g class="pill-float-1" transform="translate(940, 48)">
      <rect width="135" height="30" rx="15" fill="#1E293B" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" filter="url(#pill-glow)"/>
      <circle cx="16" cy="15" r="4" fill="#38BDF8" />
      <text x="28" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">SELF-HOSTED</text>
    </g>

    <!-- Pill 2: DevOps CI/CD -->
    <g class="pill-float-2" transform="translate(1010, 95)">
      <rect width="125" height="30" rx="15" fill="#1E293B" fill-opacity="0.85" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5" filter="url(#pill-glow)"/>
      <circle cx="16" cy="15" r="4" fill="#A855F7" />
      <text x="28" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">DEVSECOPS</text>
    </g>

    <!-- Pill 3: Git Forges -->
    <g class="pill-float-3" transform="translate(850, 290)">
      <rect width="120" height="28" rx="14" fill="#1E293B" fill-opacity="0.85" stroke="#EC4899" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="14" cy="14" r="4" fill="#F43F5E" />
      <text x="26" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">GIT FORGES</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g class="pill-float-4" transform="translate(990, 280)">
      <rect width="130" height="28" rx="14" fill="#1E293B" fill-opacity="0.85" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="14" cy="14" r="4" fill="#34D399" />
      <text x="26" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">FOSS &amp; SAAS</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: BRANDING, TITLE, SUBTITLE (Guaranteed on top with high contrast) -->
  <g transform="translate(90, 110)">
    <!-- Git Branch / Merge Vector Icon -->
    <g transform="translate(0, 15)">
      <!-- Octagon / Rounded Hex Backdrop -->
      <rect x="0" y="0" width="84" height="84" rx="20" fill="url(#accent-grad)" />
      <!-- Inner Branch Glyphs -->
      <circle cx="28" cy="60" r="6" fill="#FFFFFF" />
      <circle cx="28" cy="24" r="6" fill="#FFFFFF" />
      <circle cx="58" cy="38" r="6" fill="#FFFFFF" />
      <path d="M 28,60 L 28,24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <path d="M 28,48 Q 28,38 42,38 L 58,38" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Main Headings -->
    <g transform="translate(112, 0)">
      <!-- Super-title Tag -->
      <g transform="translate(0, 10)">
        <rect width="190" height="22" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.4"/>
        <text x="10" y="15" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM</text>
      </g>

      <!-- Main Title (Highest Contrast Foreground) -->
      <text x="0" y="66" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Awesome Git Repository Management</text>

      <!-- Subtitle -->
      <text x="0" y="98" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">Self-Hosted Git Servers • Lightweight Forges • Enterprise DevOps Platforms</text>

      <!-- Quick Metrics Highlights in Foreground -->
      <g transform="translate(0, 126)">
        <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
          <tspan fill="#38BDF8" font-weight="700">14+</tspan> Open-Source Forges  •  <tspan fill="#34D399" font-weight="700">7</tspan> Enterprise SaaS Solutions  •  <tspan fill="#F43F5E" font-weight="700">100%</tspan> Verified Benchmarks
        </text>
      </g>
    </g>
  </g>

  <!-- Border Highlight Stroke -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
